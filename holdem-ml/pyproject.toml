[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdem-ml"
version = "1.0.0"
description = "Texas Hold'em against machine-learning bots, with a from-scratch poker AI, card-vision CNN and hand analyser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
holdem = "holdem.cli:main"

[tool.setuptools.packages.find]
include = ["holdem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
